name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ActiveRecord::Sort Test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rails-version:
          - "8.0"
          - "8.1"
        ruby-version:
          - "3.3"
          - "3.4"
          - "4.0"
        postgres-version:
          - "18"

    steps:
      - name: Install Postgresql
        run: |
          sudo apt-get -y --purge remove $(sudo apt list --installed | grep postgresql | awk '{print $1}')
          sudo apt-get install curl ca-certificates gnupg
          sudo install -d /etc/apt/keyrings
          curl https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/pgdg.gpg
          sudo sh -c 'echo "deb [signed-by=/etc/apt/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get -y install postgresql-${{ matrix.postgres-version }}-postgis-3
          sudo systemctl start postgresql@${{ matrix.postgres-version }}-main.service
          sudo systemctl status postgresql@${{ matrix.postgres-version }}-main.service
          sudo pg_lsclusters
          sudo -u postgres createuser runner --superuser
          sudo -u postgres psql -c "ALTER USER runner WITH PASSWORD 'runner';"

      - uses: actions/checkout@v7

      - name: Add logger for Ruby 3.5 (no longer bundled gem, drop when rails adds)
        run: |
          echo ""  >> Gemfile
          echo 'gem "logger"' >> Gemfile
          echo ""  >> Gemfile
          echo 'gem "benchmark"' >> Gemfile

      - run: |
          echo ""  >> Gemfile
          echo 'gem "rails", "~> ${{ matrix.rails-version }}.0"' >> Gemfile

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      - run: bundle exec rake test

  ar-postgresql:
    name: ActiveRecord PostgresQL Test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.4"
        rails-version:
          - "8.0"
          - "8.1"
        postgres-version:
          - "18"

    steps:
      - name: Install Postgresql
        run: |
          sudo apt-get -y --purge remove $(sudo apt list --installed | grep postgresql | awk '{print $1}')
          sudo apt-get install curl ca-certificates gnupg
          sudo install -d /etc/apt/keyrings
          curl https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/pgdg.gpg
          sudo sh -c 'echo "deb [signed-by=/etc/apt/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get -y install postgresql-${{ matrix.postgres-version }}-postgis-3
          sudo systemctl start postgresql@${{ matrix.postgres-version }}-main.service
          sudo systemctl status postgresql@${{ matrix.postgres-version }}-main.service
          sudo pg_lsclusters
          sudo -u postgres createuser runner --superuser
          sudo -u postgres psql -c "ALTER USER runner WITH PASSWORD 'runner';"

      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Download Rails
        run: |
          series="${{ matrix.rails-version }}"
          esc="${series//./\\.}"
          RAILS_TAG=$(git ls-remote --tags --refs https://github.com/rails/rails.git "v${series}*" \
            | sed 's,.*refs/tags/,,' \
            | grep -E "^v${esc}(\.[0-9]+)+$" \
            | sort -V | tail -1)
          test -n "$RAILS_TAG" || { echo "No Rails release tag found for series ${series}"; exit 1; }
          echo "Using latest Rails tag for ${series}: $RAILS_TAG"
          git clone --branch "$RAILS_TAG" https://github.com/rails/rails.git ~/rails
          pushd ~/rails
          cat /home/runner/work/_temp/*.sh
          sed -i "s/Gem.ruby, '-w'/Gem.ruby, '-w0'/" ~/rails/activerecord/Rakefile
          sed -i "s/t.warning = true/t.warning = false/g" ~/rails/activerecord/Rakefile
          sed -i "/require \"active_record\"\$/a \$LOAD_PATH.unshift\(File.expand_path\(ENV['GITHUB_WORKSPACE']\)\)\nrequire 'active_record/sort'" ~/rails/activerecord/test/cases/helper.rb
          grep -q "active_record/sort" ~/rails/activerecord/test/cases/helper.rb || { echo "ERROR: failed to inject 'require active_record/sort' into helper.rb (anchor line changed upstream?)"; exit 1; }
          rm ~/rails/Gemfile.lock
          sed -i "/# Active Record./a gem 'activerecord-sort', require: 'active_record/sort', path: File.expand_path\(ENV['GITHUB_WORKSPACE']\)" ~/rails/Gemfile
          grep -q "activerecord-sort" ~/rails/Gemfile || { echo "ERROR: failed to inject activerecord-sort into Gemfile (anchor line changed upstream?)"; exit 1; }
          cat ~/rails/Gemfile

      - name: Bundle
        run: |
          pushd ~/rails
          bundle update --jobs=3 --retry=3
          popd

      - run: |
          pushd ~/rails/activerecord
          bundle exec rake db:postgresql:rebuild postgresql:test
          bundle exec rake db:postgresql:rebuild postgresql:isolated_test
          
  ar-sqlite:
    name: ActiveRecord SQLite Test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.4"
        rails-version:
          - "8.0"
          - "8.1"

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Download Rails
        run: |
          series="${{ matrix.rails-version }}"
          esc="${series//./\\.}"
          RAILS_TAG=$(git ls-remote --tags --refs https://github.com/rails/rails.git "v${series}*" \
            | sed 's,.*refs/tags/,,' \
            | grep -E "^v${esc}(\.[0-9]+)+$" \
            | sort -V | tail -1)
          test -n "$RAILS_TAG" || { echo "No Rails release tag found for series ${series}"; exit 1; }
          echo "Using latest Rails tag for ${series}: $RAILS_TAG"
          git clone --branch "$RAILS_TAG" https://github.com/rails/rails.git ~/rails
          pushd ~/rails
          cat /home/runner/work/_temp/*.sh
          sed -i "s/Gem.ruby, '-w'/Gem.ruby, '-w0'/" ~/rails/activerecord/Rakefile
          sed -i "s/t.warning = true/t.warning = false/g" ~/rails/activerecord/Rakefile
          sed -i "/require \"active_record\"\$/a \$LOAD_PATH.unshift\(File.expand_path\(ENV['GITHUB_WORKSPACE']\)\)\nrequire 'active_record/sort'" ~/rails/activerecord/test/cases/helper.rb
          grep -q "active_record/sort" ~/rails/activerecord/test/cases/helper.rb || { echo "ERROR: failed to inject 'require active_record/sort' into helper.rb (anchor line changed upstream?)"; exit 1; }
          rm ~/rails/Gemfile.lock
          sed -i "/# Active Record./a gem 'activerecord-sort', require: 'active_record/sort', path: File.expand_path\(ENV['GITHUB_WORKSPACE']\)" ~/rails/Gemfile
          grep -q "activerecord-sort" ~/rails/Gemfile || { echo "ERROR: failed to inject activerecord-sort into Gemfile (anchor line changed upstream?)"; exit 1; }
          cat ~/rails/Gemfile

      - name: Bundle
        run: |
          pushd ~/rails
          bundle update --jobs=3 --retry=3
          popd

      - run: |
          pushd ~/rails/activerecord
          bundle exec rake sqlite3:test
          rm test/db/*.sqlite3 test/fixtures/*.sqlite3
          bundle exec rake sqlite3:isolated_test
          rm test/db/*.sqlite3 test/fixtures/*.sqlite3
          bundle exec rake sqlite3_mem:test
        
  ar-mysql:
    name: ActiveRecord MySQL Test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.4"
        rails-version:
          - "8.0"
          - "8.1"
        mysql-version:
          - "8.4"
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Setup MySQL user
        run: |
          mysql -h127.0.0.1 -P3306 -uroot -e "CREATE USER 'rails'@'%';"
          mysql -h127.0.0.1 -P3306 -uroot -e "GRANT ALL PRIVILEGES ON *.* TO 'rails'@'%' WITH GRANT OPTION;"

      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Download Rails
        run: |
          series="${{ matrix.rails-version }}"
          esc="${series//./\\.}"
          RAILS_TAG=$(git ls-remote --tags --refs https://github.com/rails/rails.git "v${series}*" \
            | sed 's,.*refs/tags/,,' \
            | grep -E "^v${esc}(\.[0-9]+)+$" \
            | sort -V | tail -1)
          test -n "$RAILS_TAG" || { echo "No Rails release tag found for series ${series}"; exit 1; }
          echo "Using latest Rails tag for ${series}: $RAILS_TAG"
          git clone --branch "$RAILS_TAG" https://github.com/rails/rails.git ~/rails
          pushd ~/rails
          cat /home/runner/work/_temp/*.sh
          sed -i "s/Gem.ruby, '-w'/Gem.ruby, '-w0'/" ~/rails/activerecord/Rakefile
          sed -i "s/t.warning = true/t.warning = false/g" ~/rails/activerecord/Rakefile
          sed -i "/require \"active_record\"\$/a \$LOAD_PATH.unshift\(File.expand_path\(ENV['GITHUB_WORKSPACE']\)\)\nrequire 'active_record/sort'" ~/rails/activerecord/test/cases/helper.rb
          grep -q "active_record/sort" ~/rails/activerecord/test/cases/helper.rb || { echo "ERROR: failed to inject 'require active_record/sort' into helper.rb (anchor line changed upstream?)"; exit 1; }
          rm ~/rails/Gemfile.lock
          sed -i "/# Active Record./a gem 'activerecord-sort', require: 'active_record/sort', path: File.expand_path\(ENV['GITHUB_WORKSPACE']\)" ~/rails/Gemfile
          grep -q "activerecord-sort" ~/rails/Gemfile || { echo "ERROR: failed to inject activerecord-sort into Gemfile (anchor line changed upstream?)"; exit 1; }
          cat ~/rails/Gemfile

      - name: Bundle
        run: |
          pushd ~/rails
          bundle update --jobs=3 --retry=3
          popd

      - run: |
          pushd ~/rails/activerecord
          bundle exec rake db:mysql:rebuild mysql2:test
          bundle exec rake db:mysql:rebuild mysql2:isolated_test
